name: alu_connect
description: ALU Intercampus Connect — a mobile-first student engagement and collaboration platform for the African Leadership University ecosystem.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.0          # state management (Technical Initiative)
  shared_preferences: ^2.2.0 # local persistence for auth + RSVPs (beyond minimum)
  uuid: ^4.0.0              # stable IDs for user-created posts
  intl: ^0.19.0            # date/time formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
